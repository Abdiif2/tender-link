<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TenderLink Ethiopia — Ethiopian Tender Discovery &amp; Publishing Platform</title>
    <meta
      name="description"
      content="Discover and publish tenders across Ethiopia in Amharic and English. Independent procurement discovery platform with verified source labels, ETB pricing, and deadline alerts."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B1F3A" />

    <!-- Open Graph -->
    <meta property="og:title" content="TenderLink Ethiopia — Ethiopian Tender Discovery &amp; Publishing Platform" />
    <meta
      property="og:description"
      content="Independent mobile-first tender discovery and publishing platform for Ethiopian SMEs, contractors, consultants, NGOs, and organisations in English and Amharic."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_ET" />
    <meta property="og:locale:alternate" content="am_ET" />
    <meta property="og:site_name" content="TenderLink Ethiopia" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TenderLink Ethiopia — Tender Discovery for Ethiopia" />
    <meta
      name="twitter:description"
      content="Browse Ethiopian tenders by sector, region, and source type in English and Amharic with transparent ETB pricing."
    />

    <!-- Typography: Plus Jakarta Sans + Noto Sans Ethiopic + JetBrains Mono (swap for low-bandwidth) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TenderLink Ethiopia",
        "alternateName": "ቴንደርሊንክ ኢትዮጵያ",
        "description": "Independent Ethiopian tender discovery and publishing platform in English and Amharic.",
        "inLanguage": ["en", "am"]
      }
    </script>
  </head>
  <body class="bg-[#F3F5F9] text-[#0B1F3A] antialiased selection:bg-[#EFF6FF] selection:text-[#1D4ED8]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
